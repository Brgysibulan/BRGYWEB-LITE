<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Content Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20260901-access2">
  <link rel="stylesheet" href="../assets/css/access.css?v=20260901-access2">
</head>
<body class="access-page">
  <main class="access-wrap">
    <section class="access-login-card">
      <div class="access-brand"><div class="access-brand-mark">B</div><div><strong>BRGYWEB-LITE</strong><small>Content Management Access</small></div></div>
      <span class="eyebrow">Approved Accounts</span>
      <h1 class="h2 mt-2 mb-2">Content Admin Login</h1>
      <p class="text-secondary mb-4">Sign in using an approved and activated Content Admin account.</p>
      <form id="editor-login-form" novalidate>
        <div class="mb-3"><label class="form-label" for="editor-email">Email</label><input class="form-control" id="editor-email" type="email" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="editor-password">Password</label><input class="form-control" id="editor-password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-dark btn-lg w-100" type="submit">Sign in</button>
        <div id="editor-login-status" class="small mt-3 text-secondary" role="status" aria-live="polite"></div>
      </form>
      <div class="access-secondary"><p>Need Content Admin access?</p><a class="btn btn-outline-success w-100" href="apply.html">Apply for Content Admin</a></div>
      <div class="d-flex justify-content-between gap-3 mt-4 small"><a href="../index.html">← Public website</a><a href="../admin/login.html">System Admin</a></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=20260901-access2"></script>
  <script src="../assets/js/editor.js?v=20260901-access2"></script>
</body>
</html>
