<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate Content Admin Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20260901-applications1">
</head>
<body class="auth-page">
  <main class="auth-shell container py-5">
    <section class="auth-card mx-auto">
      <div class="mb-4">
        <span class="eyebrow">Approved Access</span>
        <h1 class="h3 mt-2 mb-2">Activate Content Admin Account</h1>
        <p class="text-secondary mb-0">Set your password to finish activating your approved account.</p>
      </div>
      <form id="content-admin-activation-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="activation-password">New Password</label>
          <input class="form-control form-control-lg" id="activation-password" type="password" autocomplete="new-password" minlength="8" required disabled>
        </div>
        <div class="mb-3">
          <label class="form-label" for="activation-confirm">Confirm Password</label>
          <input class="form-control form-control-lg" id="activation-confirm" type="password" autocomplete="new-password" minlength="8" required disabled>
        </div>
        <button class="btn btn-dark btn-lg w-100" id="activation-submit" type="submit" disabled>Activate Account</button>
        <div id="activation-status" class="small mt-3 text-secondary" role="status" aria-live="polite">Checking invitation…</div>
      </form>
      <a class="d-inline-block mt-4 small" href="login.html">Back to Content Admin login</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=20260901-applications1"></script>
  <script src="../assets/js/content-admin-activate.js?v=20260901-applications1"></script>
</body>
</html>
