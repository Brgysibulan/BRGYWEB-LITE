<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="auth-page">
  <main class="auth-shell container py-5">
    <section class="auth-card mx-auto">
      <div class="mb-4">
        <span class="eyebrow">BRGYWEB-LITE</span>
        <h1 class="h3 mt-2 mb-2">Initial Admin Setup</h1>
        <p class="text-secondary mb-0">Create the first administrator account. This setup works only once.</p>
      </div>

      <form id="admin-setup-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="setup-name">Display Name</label>
          <input class="form-control form-control-lg" id="setup-name" type="text" autocomplete="name" placeholder="Administrator">
        </div>
        <div class="mb-3">
          <label class="form-label" for="setup-email">Admin Email</label>
          <input class="form-control form-control-lg" id="setup-email" type="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="setup-password">Password</label>
          <input class="form-control form-control-lg" id="setup-password" type="password" autocomplete="new-password" minlength="10" required>
          <div class="form-text">Use at least 10 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="setup-password-confirm">Confirm Password</label>
          <input class="form-control form-control-lg" id="setup-password-confirm" type="password" autocomplete="new-password" minlength="10" required>
        </div>
        <button class="btn btn-dark btn-lg w-100" type="submit">Create Admin Account</button>
        <div id="admin-setup-status" class="small mt-3 text-secondary" role="status"></div>
      </form>

      <a class="d-inline-block mt-4 small" href="login.html">Already set up? Go to Admin Login</a>
    </section>
  </main>

  <script src="../assets/js/admin-setup.js?v=0f7c8027"></script>
</body>
</html>
