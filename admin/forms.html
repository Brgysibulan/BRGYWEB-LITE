<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Downloadable Forms Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20260901-forms1">
</head>
<body class="dashboard-page">
  <main class="container py-4 py-lg-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div><span class="eyebrow">Content Manager</span><h1 class="h3 mb-0">Downloadable Forms</h1><p class="text-secondary mb-0 mt-1">Upload, publish, organize, and remove public barangay forms.</p></div>
      <div class="d-flex gap-2"><a class="btn btn-outline-dark" href="dashboard.html">Dashboard</a><a class="btn btn-outline-dark" href="../forms.html">Public Page</a></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <section class="section-card">
          <h2 class="h5 mb-3" id="form-manager-title">Add Downloadable Form</h2>
          <form id="downloadable-form-form" class="row g-3">
            <input id="downloadable-form-id" type="hidden">
            <input id="downloadable-form-existing-url" type="hidden">
            <div class="col-12"><label class="form-label" for="downloadable-form-name">Form Name</label><input class="form-control" id="downloadable-form-name" type="text" maxlength="180" required placeholder="e.g. Barangay Clearance Application"></div>
            <div class="col-md-7"><label class="form-label" for="downloadable-form-category">Category</label><input class="form-control" id="downloadable-form-category" type="text" maxlength="100" placeholder="Clearance, Certificate, Application"></div>
            <div class="col-md-5"><label class="form-label" for="downloadable-form-order">Display Order</label><input class="form-control" id="downloadable-form-order" type="number" min="0" step="1" value="0"></div>
            <div class="col-12"><label class="form-label" for="downloadable-form-description">Description</label><textarea class="form-control" id="downloadable-form-description" rows="3" maxlength="600" placeholder="Short instructions or purpose of the form"></textarea></div>
            <div class="col-12"><label class="form-label" for="downloadable-form-file">File</label><input class="form-control" id="downloadable-form-file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><div class="form-text">PDF, Word, or Excel. Maximum 10 MB. Leave empty while editing to keep the current file.</div></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" id="downloadable-form-published" type="checkbox" checked><label class="form-check-label" for="downloadable-form-published">Published on public website</label></div></div>
            <div class="col-12 d-flex gap-2"><button class="btn btn-dark" type="submit">Save Form</button><button class="btn btn-outline-secondary d-none" id="downloadable-form-cancel" type="button">Cancel Edit</button></div>
            <div class="col-12"><span id="downloadable-form-status" class="small text-secondary" aria-live="polite"></span></div>
          </form>
        </section>
      </div>

      <div class="col-lg-7">
        <section class="section-card">
          <div class="d-flex justify-content-between align-items-center gap-2 mb-3"><div><span class="eyebrow">Library</span><h2 class="h5 mb-0">Existing Forms</h2></div><button class="btn btn-sm btn-outline-dark" id="downloadable-form-refresh" type="button">Refresh</button></div>
          <div id="downloadable-form-list" class="d-grid gap-3"><div class="text-secondary">Loading forms...</div></div>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=20260901-forms1"></script>
  <script src="../assets/js/admin-forms.js?v=20260901-forms1"></script>
  <script src="../assets/js/staff-context.js?v=20260901-forms1"></script>
</body>
</html>
