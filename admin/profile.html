<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barangay Profile Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="dashboard-page">
  <main class="dashboard-main container py-4 py-lg-5">
    <header class="dashboard-topbar mb-4">
      <div><span class="eyebrow">Content Manager</span><h1 class="h3 mb-0">Barangay Profile</h1></div>
      <div class="d-flex gap-2"><a class="btn btn-outline-dark" href="dashboard.html">Dashboard</a><a class="btn btn-outline-dark" href="../barangay-profile.html">View Public Page</a><button class="btn btn-dark" id="profile-signout" type="button">Sign out</button></div>
    </header>

    <section class="section-card">
      <p class="text-secondary">Edit the reusable public profile sections below. Published sections appear on the public Barangay Profile page.</p>
      <form id="profile-form" class="row g-4">
        <div class="col-12">
          <label class="form-label" for="profile-about">About the Barangay</label>
          <textarea class="form-control" id="profile-about" rows="5" placeholder="General barangay overview, location, community background..."></textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="profile-history">History</label>
          <textarea class="form-control" id="profile-history" rows="6" placeholder="Barangay history and notable background..."></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="profile-vision">Vision</label>
          <textarea class="form-control" id="profile-vision" rows="6"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="profile-mission">Mission</label>
          <textarea class="form-control" id="profile-mission" rows="6"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="profile-highlights">Profile Highlights</label>
          <textarea class="form-control" id="profile-highlights" rows="5" placeholder="Population, households, land area, puroks, key facilities, or other highlights..."></textarea>
          <div class="form-text">Use one highlight per line for a clean public display.</div>
        </div>
        <div class="col-12 d-flex flex-wrap align-items-center gap-3">
          <div class="form-check form-switch"><input class="form-check-input" id="profile-published" type="checkbox" checked><label class="form-check-label" for="profile-published">Publish profile</label></div>
          <button class="btn btn-dark" type="submit">Save Barangay Profile</button>
          <span id="profile-status" class="small text-secondary" role="status"></span>
        </div>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/admin-profile.js"></script>
</body>
</html>
