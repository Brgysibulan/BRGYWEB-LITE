<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Officials</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="dashboard-page">
  <div class="dashboard-shell">
    <aside class="sidebar">
      <div><div class="sidebar-brand">BRGYWEB-LITE</div><div class="sidebar-role">Administrator</div></div>
      <nav class="sidebar-nav mt-4"><a href="dashboard.html">Dashboard</a><a class="active" href="officials.html">Officials</a></nav>
      <a class="sidebar-exit" href="../officials.html">View public officials</a>
    </aside>
    <main class="dashboard-main">
      <header class="dashboard-topbar"><div><span class="eyebrow">Content Manager</span><h1 class="h3 mb-0">Barangay Officials</h1></div><button class="btn btn-outline-dark" id="admin-signout" type="button">Sign out</button></header>
      <section class="dashboard-section"><div class="section-card"><div class="section-card-head flex-wrap"><div><span class="eyebrow">Add / Edit</span><h2 class="h5 mb-0">Official Details</h2></div><button class="btn btn-sm btn-outline-secondary" id="official-reset" type="button">Clear form</button></div><form id="official-form" class="row g-3 mt-1"><input id="official-id" type="hidden"><div class="col-md-6"><label class="form-label" for="official-name">Full Name</label><input class="form-control" id="official-name" type="text" maxlength="160" required></div><div class="col-md-6"><label class="form-label" for="official-position">Position</label><input class="form-control" id="official-position" type="text" maxlength="160" required></div><div class="col-md-8"><label class="form-label" for="official-photo">Photo URL</label><input class="form-control" id="official-photo" type="url" placeholder="https://..."></div><div class="col-md-4"><label class="form-label" for="official-order">Display Order</label><input class="form-control" id="official-order" type="number" min="0" value="0"></div><div class="col-12"><label class="form-label" for="official-bio">Short Bio / Committee</label><textarea class="form-control" id="official-bio" rows="3" maxlength="1000"></textarea></div><div class="col-12"><div class="form-check"><input class="form-check-input" id="official-active" type="checkbox" checked><label class="form-check-label" for="official-active">Published / visible on public website</label></div></div><div class="col-12 d-flex flex-wrap gap-3 align-items-center"><button class="btn btn-dark" type="submit">Save Official</button><span id="official-status" class="small text-secondary"></span></div></form></div></section>
      <section class="dashboard-section"><div class="section-card"><div class="table-responsive mt-3"><table class="table align-middle mb-0"><thead><tr><th>Order</th><th>Name</th><th>Position</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody id="officials-admin-list"><tr><td colspan="5" class="text-secondary">Loading officials...</td></tr></tbody></table></div></div></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/admin-officials.js"></script><script src="../assets/js/staff-context.js"></script>
</body></html>
