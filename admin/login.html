<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="auth-page">
  <main class="auth-shell container py-5">
    <section class="auth-card mx-auto">
      <div class="mb-4">
        <span class="eyebrow">BRGYWEB-LITE</span>
        <h1 class="h3 mt-2 mb-2">Admin Login</h1>
        <p class="text-secondary mb-0">Full system access for the barangay administrator.</p>
      </div>
      <form id="admin-login-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="admin-email">Email</label>
          <input class="form-control form-control-lg" id="admin-email" type="email" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="admin-password">Password</label>
          <input class="form-control form-control-lg" id="admin-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-dark btn-lg w-100" type="submit">Sign in</button>
        <div id="admin-login-status" class="small mt-3 text-secondary" role="status"></div>
      </form>
      <a class="d-inline-block mt-4 small" href="../index.html">Back to public website</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
