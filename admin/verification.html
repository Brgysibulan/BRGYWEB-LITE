<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification Records</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/admin.css"></head><body class="dashboard-page"><div class="dashboard-shell"><aside class="sidebar"><div><div class="sidebar-brand">BRGYWEB-LITE</div><div class="sidebar-role">Administrator</div></div><nav class="sidebar-nav mt-4"><a href="dashboard.html">Dashboard</a><a class="active" href="verification.html">Verification</a></nav><a class="sidebar-exit" href="../verify.html">View public verify</a></aside><main class="dashboard-main"><header class="dashboard-topbar"><div><span class="eyebrow">Secure Records</span><h1 class="h3 mb-0">Verification Records</h1></div><button class="btn btn-outline-dark" id="admin-signout" type="button">Sign out</button></header><section class="dashboard-section"><div class="section-card"><form id="verification-form" class="row g-3"><input type="hidden" id="verification-id"><div class="col-md-4"><label class="form-label">Control Number</label><input class="form-control" id="verification-control" required></div><div class="col-md-4"><label class="form-label">First Name</label><input class="form-control" id="verification-first"></div><div class="col-md-4"><label class="form-label">Middle Name</label><input class="form-control" id="verification-middle"></div><div class="col-md-4"><label class="form-label">Last Name</label><input class="form-control" id="verification-last"></div><div class="col-md-4"><label class="form-label">Designation</label><input class="form-control" id="verification-designation"></div><div class="col-md-2"><label class="form-label">Date Acquired</label><input class="form-control" id="verification-acquired" type="date"></div><div class="col-md-2"><label class="form-label">Expiration</label><input class="form-control" id="verification-expiration" type="date"></div><div class="col-md-3"><label class="form-label">Status</label><select class="form-select" id="verification-status"><option>ACTIVE</option><option>INACTIVE</option><option>EXPIRED</option></select></div><div class="col-12 d-flex gap-2"><button class="btn btn-dark" type="submit">Save Record</button><button class="btn btn-outline-secondary" type="button" id="verification-clear">Clear</button><span id="verification-status-text" class="small text-secondary align-self-center"></span></div></form></div></section><section class="dashboard-section"><div class="section-card"><div class="d-flex flex-wrap justify-content-between gap-3 align-items-center"><div><span class="eyebrow">Database</span><h2 class="h5 mb-0">All Verification Records</h2></div><input class="form-control" id="verification-search" style="max-width:320px" placeholder="Search control number or name"></div><div class="table-responsive mt-4"><table class="table align-middle"><thead><tr><th>Control #</th><th>Name</th><th>Designation</th><th>Status</th><th class="text-end">Action</th></tr></thead><tbody id="verification-list"><tr><td colspan="5" class="text-secondary">Loading records...</td></tr></tbody></table></div></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/admin.js"></script><script src="../assets/js/admin-verification.js"></script></body></html>
